name: Checks

on:
  push:
  pull_request:

jobs:
  frozen-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and the game/* tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: No closed game was changed
        # For a PR the checkout is a merge commit; its first parent is the target branch.
        run: python scripts/check_frozen.py --base "${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
